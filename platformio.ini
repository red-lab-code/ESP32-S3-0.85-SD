[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-fh4r2
framework = arduino

; Debugging settings
;debug_tool = esp-builtin
;debug_init_break = tbreak setup
;debug_load_mode = manual
;build_type = debug
;debug_speed = 20000
;debug_extra_cmds = 
;    set remotetimeout 10
  
lib_deps = 
    FS
    SD_MMC
    SPI

lib_ldf_mode = chain+

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D LV_CONF_INCLUDE_SIMPLE
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"

monitor_speed = 115200

; ---------------------------------------------------------
; ENVIRONMENT 1: Weather clock with LVGL
; ---------------------------------------------------------
[env:lvgl_weather_clock]
board_build.partitions = huge_app.csv
; Compila solo la cartella LVGL_WeatherClock escludendo generated/ (già inclusa dai .c)
build_src_filter = -<*> +<LVGL_WeatherClock/*> -<LVGL_WeatherClock/generated/>
build_flags = 
    ${env.build_flags}
    -I src/LVGL_WeatherClock

; ---------------------------------------------------------
; ENVIRONMENT 2: RGB and LCD test
; ---------------------------------------------------------
[env:rgb_lcd]
board_build.partitions = default.csv
build_src_filter = -<*> +<RGB_LCD/*>
build_flags = 
    ${env.build_flags}
    -I src/RGB_LCD

; ---------------------------------------------------------
; ENVIRONMENT 3: Playback Video from SD
; ---------------------------------------------------------
[env:video_demo]
board_build.partitions = default.csv
build_src_filter = -<*> +<Video_demo/*>
build_flags = 
    ${env.build_flags}
    -I src/Video_demo
